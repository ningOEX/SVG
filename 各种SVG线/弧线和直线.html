<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
   <svg
      width="500"
      height="500"
      xmlns="http://www.w3.org/2000/svg"
    >
      <g stroke="#ccc" stroke-width="1">
        <!-- X方向 -->
        <line x1="0" y1="-120" x2="0" y2="120" />
        <line x1="20" y1="-120" x2="20" y2="120" />
        <line x1="40" y1="-120" x2="40" y2="120" />
        <line x1="60" y1="-120" x2="60" y2="120" />
        <line x1="80" y1="-120" x2="80" y2="120" />
        <line x1="100" y1="-120" x2="100" y2="120" />

        <!-- Y方向 -->
        <line x1="0" y1="0" x2="120" y2="0" />
        <line x1="0" y1="20" x2="120" y2="20" />
        <line x1="0" y1="40" x2="120" y2="40" />
        <line x1="0" y1="60" x2="120" y2="60" />
        <line x1="0" y1="80" x2="120" y2="80" />
        <line x1="0" y1="100" x2="120" y2="100" />
      </g>
      <!-- 弧线 直线 -->
      <path d="M40 40 
                A20 20 0 0 1 80 40 
                A20 20 0 0 1 40 40
                M60 20 V40 L43 50
                M60 40 L77 50
                "
            fill="none"
            stroke="#121314" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            stroke-opacity="0.4"  
        />
    </svg>
  </body>
</html>
