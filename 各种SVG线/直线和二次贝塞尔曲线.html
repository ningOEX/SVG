<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <svg
      width="500"
      height="500"
      xmlns="http://www.w3.org/2000/svg"
    >
      <g stroke="#ccc" stroke-width="1">
        <!-- X方向 -->
        <line x1="0" y1="-120" x2="0" y2="120" />
        <line x1="20" y1="-120" x2="20" y2="120" />
        <line x1="40" y1="-120" x2="40" y2="120" />
        <line x1="60" y1="-120" x2="60" y2="120" />
        <line x1="80" y1="-120" x2="80" y2="120" />
        <line x1="100" y1="-120" x2="100" y2="120" />

        <!-- Y方向 -->
        <line x1="0" y1="0" x2="120" y2="0" />
        <line x1="0" y1="20" x2="120" y2="20" />
        <line x1="0" y1="40" x2="120" y2="40" />
        <line x1="0" y1="60" x2="120" y2="60" />
        <line x1="0" y1="80" x2="120" y2="80" />
        <line x1="0" y1="100" x2="120" y2="100" />
      </g>
      <!-- 直线 -->
      <path d="M25 20 H20 V25 
                M35 20 H40 V25 
                M20 35 V40 H25 
                M35 40 H40 V35 
                M20 30 H40" 
            fill="none"
            stroke="#121314" 
            stroke-width="1" 
            stroke-linecap="round" 
            stroke-linejoin="round"  
        />
        <!-- 二次贝塞尔曲线 Q -->
        <path d="M60 40 Q80 20, 100 40" stroke="#121314" stroke-width="1" fill="none" />
        <!-- 三次贝塞尔曲线 C -->
        <path d="M40 80 C60 60, 80 100, 100 80" stroke="#121314" stroke-width="1" fill="none" />
        
    </svg>
  </body>
</html>
