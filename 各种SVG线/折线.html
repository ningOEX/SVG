<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        #c1{
            transition: all 0.3s ease;
        }
        #c1:hover {
            stroke: #f40;
            stroke-width: 3;
        }
    </style>
  </head>
  <body>
   <svg
      width="500"
      height="500"
      xmlns="http://www.w3.org/2000/svg"
    >
      <g stroke="#ccc" stroke-width="1">
        <!-- X方向 -->
        <line x1="0" y1="-120" x2="0" y2="120" />
        <line x1="20" y1="-120" x2="20" y2="120" />
        <line x1="40" y1="-120" x2="40" y2="120" />
        <line x1="60" y1="-120" x2="60" y2="120" />
        <line x1="80" y1="-120" x2="80" y2="120" />
        <line x1="100" y1="-120" x2="100" y2="120" />

        <!-- Y方向 -->
        <line x1="0" y1="0" x2="120" y2="0" />
        <line x1="0" y1="20" x2="120" y2="20" />
        <line x1="0" y1="40" x2="120" y2="40" />
        <line x1="0" y1="60" x2="120" y2="60" />
        <line x1="0" y1="80" x2="120" y2="80" />
        <line x1="0" y1="100" x2="120" y2="100" />
      </g>
      <!-- 折线 -->
      <path d="M40 20 L60 60 L80 20, 
                M40 60 L60 20 L80 60, 
                M40 40 
                A20 20 0 0 1 80 40
                A20 20 0 0 1 40 40
                "
            fill="none"
            stroke="#f40" 
            stroke-width="1" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            stroke-opacity="0.5"  
        />
        <path d="M 40 40 
        A20 20 0 1 1 0 40 
        A20 20 0 1 1 40 40" 
      stroke="#d32f2f" stroke-width="3" fill="none"/>
      <path id="c1" d="M100 70
                A10 10 0 1 1 80 70
                A10 10 0 1 1 100 70
                M90 70 L95 75
                M90 70 L85 75
                M90 70 L95 65
                M90 70 L85 65
      " stroke="#d32f2f" stroke-width="1" fill="none" />
    </svg>
  </body>
</html>
