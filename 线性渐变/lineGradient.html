            <linearGradient id="linearGradient" x1="1" x2="0" y1="1" y2="0">
                <stop offset="0" stop-color="#f00"/>

                <stop offset="50" stop-color="#f0f"/>
                <stop offset="75" stop-color="#0f0"/>

              <clipPath id="clipPath">
               <text x="100" y="100" text-anchor="middle" font-size="40" font-family="system-ui" >S V G</text>
            </clipPath>
        </defs>
        <rect x="0" y="0" width="200" height="200" fill="url(#linearGradient)" clip-path="url(#clipPath)" />
    </svg>
