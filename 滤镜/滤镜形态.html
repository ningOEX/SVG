<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 滤镜形态 feMorphology -->
    <svg width="600" height="500">
        <defs>
            <filter id="f2">
                <feMorphology in="SourceGraphic" operator="dilate" radius="1" result="img1"/>
                <feFlood flood-color="#fac" flood-opacity="1" result="img2"/>
                <feComposite in="img2" in2="img1" operator="in" result="img3"/>
                <feMerge>
                    <feMergeNode in="img3"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>
        <rect x="0" y="0" width="600" height="500" fill="none" stroke="#fac" stroke-width="2" stroke-dasharray="2.5"/>
        <image href="../images/2.png" height="100%" width="100%" filter="url(#f2)"/>
    </svg>
    <svg width="600" height="500">
        <defs>
           <filter id="f1" x="0" y="0" width="100%" height="100%">
                <feTurbulence baseFrequency="0.05" numOctaves="1" stitchTiles="stitch" />
           </filter>
        </defs>
        <rect x="0" y="0" width="600" height="500" fill="none" stroke="#fac" stroke-width="2" stroke-dasharray="2.5"/>

        <rect x="20" y="20" width="560" height="200" fill="#fac" filter="url(#f1)"/>
        <rect x="20" y="220" width="560" height="200" fill="#fac" filter="url(#f1)"/>
    </svg>
</body>
</html>
